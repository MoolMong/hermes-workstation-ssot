# Hermes Workstation SSOT — compose definition (Milestone 1 base, Milestone
# 2 command/persistence fix)
#
# Exactly ONE Hermes container/service (BUILD_DIRECTIVE.md §1: Hermes is
# the orchestrator; there is no second orchestrator runtime). Hermes
# orchestration happens inside its own `hermes gateway` process, so this
# is the process the single container runs. Monitor's system_check
# (BUILD_DIRECTIVE.md §1) watches "Hermes container" (Docker-layer: is the
# container up) and "Hermes Gateway" (application-layer: is the gateway
# process inside that same container responding, e.g. Discord
# connectivity) as two CHECKS on this one container, not two containers —
# see ARCHITECTURE.md §9 for the full reasoning.
#
# Supervision: this file intentionally sets `restart: "no"`. systemd
# (systemd/hermes.service) is the single bounded supervisor for this
# container — see that unit's StartLimitIntervalSec / StartLimitBurst /
# Restart=on-failure / RestartSec. Letting Docker's own restart policy AND
# systemd both restart the same failure would create two overlapping,
# effectively-infinite restart loops for one fault; this repository picks
# systemd as the one supervisor instead of layering both.
#
# No secrets live in this file, and (as of Milestone 2) no config/*.env are
# injected via `env_file` here — Milestone 1 originally planned that, but
# Milestone 2 grounded the design against the real upstream Hermes Agent
# CLI, which auto-loads its own $HERMES_HOME/.env at startup
# (hermes_cli/env_loader.py) and persists OAuth/session state to
# $HERMES_HOME/auth.json — both already reachable through the /data bind
# mount below, so no separate Compose-level secret injection is needed.
# `hermes-connect` (bootstrap/connect.sh) writes directly into that
# bind-mounted volume. See SECURITY.md §3 and evidence/milestone-2/TASK.md.
#
# `command` runs the gateway's `run` subcommand explicitly. `hermes
# gateway` alone only prints gateway subcommand help — it does not start
# the gateway (hermes_cli/subcommands/gateway.py:
# `hermes gateway run|install|start|stop|restart|status|setup`).

services:
  hermes:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hermes-workstation/hermes-agent:m1
    container_name: hermes
    command: ["hermes", "gateway", "run"]
    restart: "no"
    volumes:
      - ${HERMES_DATA_ROOT:-/opt/hermes-data}:/data
