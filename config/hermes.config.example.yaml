# Template for the real config/hermes.config.yaml, created during
# bootstrap (Milestone 1) on the target instance and git-ignored.
# Non-secret runtime configuration only. Milestone 2 credentials live only
# in the bind-mounted `/opt/hermes-data/.env`, `auth.json`, and `auth/`
# locations inventoried in SECURITY.md §3 — never in this template.

# Filesystem root for task state, workspaces, logs, and backups
# (see ARCHITECTURE.md §4).
data_root: /opt/hermes-data

# Maximum concurrent Claude Code workers (Milestone 6). Must stay <= 3
# per BUILD_DIRECTIVE.md §2.
max_parallel_workers: 3

# Bounded repair/retry policy (WORK_PROTOCOL.md §4, BUILD_DIRECTIVE.md §5).
max_repair_attempts: REPLACE_ME
max_task_retries: REPLACE_ME

discord:
  guild_id: REPLACE_ME
  status_channel_id: REPLACE_ME
